<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Edit Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="darkModeToggle">🌙</button>
  <div class="container">
    <div style="display:flex; align-items:center; gap:0.6rem; margin-bottom:1rem;">
      <button id="backBtn" style="padding:0.4rem 0.8rem; border-radius:8px;">← Back</button>
      <h1 style="margin:0">Edit Profile</h1>
    </div>
    
    <label>Name: <input id="name" type="text"></label>
    <label>Avatar URL: <input id="avatar" type="text"></label>
    <div>
      <img id="avatarPreview" src="" alt="avatar" style="width:80px;height:80px;border-radius:50%;display:block;margin-top:8px;">
    </div>
    <button id="saveProfile">Save</button>
    <p id="msg"></p>
  </div>
  <script>
    // darkmode init (same as other pages)
    const toggle = document.getElementById("darkModeToggle");
    const savedMode = localStorage.getItem("darkmode");
    if (savedMode === "on") {
      document.body.classList.add("darkmode");
      toggle.textContent = "☀️";
    } else {
      toggle.textContent = "🌙";
    }
    toggle.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("darkmode");
      localStorage.setItem("darkmode", isDark ? "on" : "off");
      toggle.textContent = isDark ? "☀️" : "🌙";
    });
  </script>
  <script src="nav.js"></script>
  <script src="profile.js"></script>
</body>
</html>
